<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Quick Notes</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <span id="site" class="site"></span>
    <button id="clearBtn" class="clear-btn" title="Clear note for this site">Clear</button>
  </div>
  <textarea id="note" placeholder="Write a note for this site..."></textarea>
  <div class="footer">
    <span id="status" class="status"></span>
    <label class="global-toggle">
      <input type="checkbox" id="globalToggle" />
      Use one note for all sites
    </label>
  </div>
  <script src="popup.js"></script>
</body>
</html>
