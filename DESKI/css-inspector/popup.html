<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>CSS Inspector</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 240px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fdf2f8;
      color: #1f2937;
      padding: 14px;
      text-align: center;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px;
      color: #831843;
    }
    p {
      font-size: 12px;
      color: #6b7280;
      margin: 0 0 14px;
    }
    button {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 7px;
      background: #db2777;
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #be185d; }
    button.active { background: #059669; }
  </style>
</head>
<body>
  <h1>🎯 Click CSS Inspector</h1>
  <p>Toggle it on, then hover and click any element on the page to see its styles.</p>
  <button id="toggleBtn">Enable Inspector</button>
  <script src="popup.js"></script>
</body>
</html>
